name: Review Guardian

on:
  # Trigger when CI workflows complete on a PR
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

  # Trigger when Gemini posts a failure comment
  issue_comment:
    types: [created]

  # Trigger when a review is submitted (to detect non-approving reviews)
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Fallback when Gemini posts "unable to generate" message
  gemini-failed:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'Gemini is unable to generate a summary for this pull request')
    runs-on: ubuntu-latest
    steps:
      - name: Request fallback review
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AGENT: ${{ vars.PREFERRED_AGENT || 'claude' }}
        run: |
          PR_NUM=${{ github.event.issue.number }}
          echo "Gemini Code Assist failed on PR #$PR_NUM. Requesting @$AGENT review."

          gh pr comment "$PR_NUM" --repo ${{ github.repository }} \
            --body "@$AGENT Gemini Code Assist failed to review this PR. Please perform a comprehensive code review. Check for bugs, security issues, performance problems, and code quality. Post your findings as a PR review (approve if it looks good, or request changes if there are issues). This is an automated fallback."

  # When a bot reviewer posts a COMMENTED review (not APPROVED), auto-approve
  request-approval:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'commented' &&
      contains(fromJSON('["gemini-code-assist[bot]", "copilot[bot]"]'), github.event.review.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Auto-approve after bot review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REVIEWER="${{ github.event.review.user.login }}"
          REPO="${{ github.repository }}"

          # Phase 1: Pre-wait decision
          DECISION=$(npx tsx .github/scripts/lib/cli/pipeline.ts guardian-bot-review "$PR_NUM" "$REVIEWER")
          ACTION=$(echo "$DECISION" | jq -r '.action')

          case "$ACTION" in
            already-approved)
              echo "PR #$PR_NUM already has an approval — no action needed"
              exit 0
              ;;
            defer-critical)
              CRITICAL=$(echo "$DECISION" | jq -r '.criticalCount')
              UNRESOLVED=$(echo "$DECISION" | jq -r '.unresolvedCount')
              echo "Review has $CRITICAL critical/high comments and $UNRESOLVED unresolved threads — NOT auto-approving"
              npx tsx .github/scripts/lib/cli/pipeline.ts comment "$PR_NUM" "Auto-approve skipped: found $CRITICAL inline review comment(s) with high/critical priority badges and $UNRESOLVED unresolved thread(s). These must be addressed before the PR can be approved. review-relay.yml will handle triggering fixes." "$REPO"
              exit 0
              ;;
          esac

          # Phase 2: Wait for review-relay
          echo "Waiting 90s for review-relay to process..."
          sleep 90

          # Phase 3: Post-wait decision
          POST_DECISION=$(npx tsx .github/scripts/lib/cli/pipeline.ts guardian-post-wait "$PR_NUM")
          POST_ACTION=$(echo "$POST_DECISION" | jq -r '.action')

          case "$POST_ACTION" in
            defer-review-fix-active)
              echo "review-fix.yml is active for PR #$PR_NUM — deferring approval"
              exit 0
              ;;
            defer-relay-posted)
              echo "review-relay dispatched fixes for PR #$PR_NUM — deferring approval"
              exit 0
              ;;
          esac

          echo "Bot review from $REVIEWER on PR #$PR_NUM — no issues relayed, auto-approving"
          npx tsx .github/scripts/lib/cli/pipeline.ts approve-and-merge "$PR_NUM" "Auto-approved: code review provided by $REVIEWER (no critical/high issues found)." "$REPO"

  # When Claude posts a review comment on a PR, auto-approve
  auto-approve-after-claude:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Auto-approve after Claude review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUM=${{ github.event.issue.number }}
          REPO="${{ github.repository }}"
          CLAUDE_BODY=$(echo '${{ toJSON(github.event.comment.body) }}' | jq -r '.')

          DECISION=$(npx tsx .github/scripts/lib/cli/pipeline.ts guardian-claude-review "$PR_NUM" "$CLAUDE_BODY")
          ACTION=$(echo "$DECISION" | jq -r '.action')

          echo "pr_num=$PR_NUM" >> $GITHUB_OUTPUT

          case "$ACTION" in
            not-review-response)
              echo "Claude comment on PR #$PR_NUM is not a review response — skipping"
              echo "has_issues=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
            already-approved)
              echo "PR #$PR_NUM already has an approval — no action needed"
              echo "has_issues=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
            has-critical-inline)
              COUNT=$(echo "$DECISION" | jq -r '.count')
              echo "PR has $COUNT critical/high-severity inline comments — NOT auto-approving"
              echo "has_issues=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
            has-issues)
              echo "Claude flagged issues — NOT auto-approving"
              echo "has_issues=true" >> $GITHUB_OUTPUT
              exit 0
              ;;
            approve)
              echo "Claude reviewed PR #$PR_NUM — auto-approving"
              echo "has_issues=false" >> $GITHUB_OUTPUT
              npx tsx .github/scripts/lib/cli/pipeline.ts approve-and-merge "$PR_NUM" "Auto-approved: code review provided by Claude." "$REPO"
              ;;
          esac
        id: review_check

      - name: Request Claude fix issues found in review
        if: steps.review_check.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=${{ steps.review_check.outputs.pr_num }}

          # Guard: only request a fix once per review cycle
          ALREADY_REQUESTED=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            -q '[.[] | select(.body | test("Fix the issues from the code review above"))] | length' 2>/dev/null || echo "0")

          if [ "$ALREADY_REQUESTED" -gt 0 ]; then
            echo "Fix already requested on PR #$PR_NUM — skipping to avoid cycle"
            exit 0
          fi

          # Extract Claude's review findings to include in the fix request
          CLAUDE_COMMENT_ID=${{ github.event.comment.id }}
          REVIEW_BODY=$(gh api "repos/$REPO/issues/comments/$CLAUDE_COMMENT_ID" \
            -q '.body' 2>/dev/null || echo "")

          # Post a fix request that quotes the specific issues
          BODY=$(cat <<EOF
          @claude Fix the issues from the code review above (comment #${CLAUDE_COMMENT_ID}).

          Here are the findings to address:

          <review_findings>
          ${REVIEW_BODY}
          </review_findings>

          Instructions:
          - Fix ONLY the issues listed above. Do NOT re-review or look at other comments.
          - After fixing, run \`pnpm typecheck\` and \`pnpm test\` to verify nothing is broken.
          - Git add and commit your fixes.
          - Do NOT post a new review. Just fix the code.
          EOF
          )
          npx tsx .github/scripts/lib/cli/pipeline.ts comment "$PR_NUM" "$BODY" "$REPO"

  # Check for missing reviews after CI passes
  ensure-review:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Check if PR needs review or approval
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "CI passed for branch: $BRANCH"

          export WORKFLOW_RUN_HEAD_BRANCH="$BRANCH"
          PR_NUM=$(npx tsx .github/scripts/lib/cli/pipeline.ts get-pr-number "workflow_run")

          if [ -z "$PR_NUM" ]; then
            echo "No open PR found for branch $BRANCH"
            exit 0
          fi

          echo "Checking reviews on PR #$PR_NUM"
          echo "pr_num=$PR_NUM" >> $GITHUB_OUTPUT

          DECISION=$(npx tsx .github/scripts/lib/cli/pipeline.ts guardian-ensure-review "$PR_NUM")
          ACTION=$(echo "$DECISION" | jq -r '.action')

          echo "Decision: $ACTION"
          echo "action=$ACTION" >> $GITHUB_OUTPUT
        id: check

      - name: Approve PR (all threads resolved after review-fix)
        if: steps.check.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=${{ steps.check.outputs.pr_num }}
          echo "All review threads resolved on PR #$PR_NUM — approving"
          npx tsx .github/scripts/lib/cli/pipeline.ts approve-and-merge "$PR_NUM" "Auto-approved: all review threads resolved after fixes landed and CI passed." "$REPO"

      - name: Dispatch auto-merge for re-evaluation
        if: steps.check.outputs.action == 'dispatch-auto-merge'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUM=${{ steps.check.outputs.pr_num }}
          echo "Dispatching auto-merge for PR #$PR_NUM"
          npx tsx .github/scripts/lib/cli/pipeline.ts dispatch "auto-merge.yml" -f pr_number="$PR_NUM"

      - name: Dispatch review-fix for unresolved threads
        if: steps.check.outputs.action == 'dispatch-review-fix'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=${{ steps.check.outputs.pr_num }}
          BRANCH=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName -q '.headRefName')

          # Gather unresolved review comments as context for Claude
          REVIEW_SUMMARY=$(gh api "repos/$REPO/pulls/$PR_NUM/comments" \
            --jq '[.[] | "\(.path):\(.line) — \(.body | split("\n")[0])"] | join("\n")' 2>/dev/null \
            | head -c 2000 || echo "Unresolved review threads on PR #$PR_NUM")

          echo "Dispatching review-fix for PR #$PR_NUM (branch: $BRANCH)"
          npx tsx .github/scripts/lib/cli/pipeline.ts dispatch "review-fix.yml" \
            -f pr_number="$PR_NUM" \
            -f pr_branch="$BRANCH" \
            -f review_summary="$REVIEW_SUMMARY" \
            -f reviewer="bot-review-guardian-fallback"

      - name: Request fallback review
        if: steps.check.outputs.action == 'request-review'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AGENT: ${{ vars.PREFERRED_AGENT || 'claude' }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=${{ steps.check.outputs.pr_num }}
          echo "Requesting @$AGENT fallback review for PR #$PR_NUM"
          npx tsx .github/scripts/lib/cli/pipeline.ts comment "$PR_NUM" "@$AGENT No code review was posted on this PR (the usual reviewer may be at quota). Please perform a comprehensive code review. Check for bugs, security issues, performance problems, and code quality. Post your findings as a PR review (approve if it looks good, or request changes if there are issues). This is an automated fallback." "$REPO"
