name: Claude Code
run-name: "Claude #${{ github.event.issue.number || github.event.pull_request.number }} by ${{ github.event.comment.user.login }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.user.login }}
  cancel-in-progress: ${{ contains(github.event.comment.body, '@claude') }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.issue != null || github.event.pull_request != null) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git and auth
        uses: ./.github/actions/setup-auth
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Switch to PR branch if applicable
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUM=${{ github.event.pull_request.number }}
          else
            PR_NUM=${{ github.event.issue.number }}
          fi
          PR_BRANCH=$(gh pr view "$PR_NUM" --json headRefName -q '.headRefName')
          echo "Switching to PR branch: $PR_BRANCH"
          git checkout "$PR_BRANCH"

      - name: Determine push target and create branches
        id: push_target
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${{ github.event.issue.pull_request }}" ] || [ -n "${{ github.event.pull_request }}" ]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "push_cmd=git push origin HEAD" >> $GITHUB_OUTPUT
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
            PR_BRANCH="claude/issue-${ISSUE_NUM}"
            TMP_BRANCH="tmp/claude-${{ github.run_id }}"

            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT
            echo "tmp_branch=$TMP_BRANCH" >> $GITHUB_OUTPUT
            echo "push_cmd=git push origin HEAD:refs/heads/$TMP_BRANCH" >> $GITHUB_OUTPUT

            # Check for existing work from previous runs.
            # Look for claude/issue-N (PR branch) and claude/issue-N-* (action branches).
            # Pick the one with the most commits ahead of master.
            BEST_BRANCH=""
            BEST_AHEAD=0

            for ref in $(git for-each-ref --format='%(refname:short)' \
              "refs/remotes/origin/claude/issue-${ISSUE_NUM}" \
              "refs/remotes/origin/claude/issue-${ISSUE_NUM}-*" \
              2>/dev/null); do
              AHEAD=$(git rev-list --count "origin/master..$ref" 2>/dev/null || echo "0")
              if [ "$AHEAD" -gt "$BEST_AHEAD" ]; then
                BEST_AHEAD=$AHEAD
                BEST_BRANCH=$(echo "$ref" | sed 's|^origin/||')
              fi
            done

            if [ "$BEST_AHEAD" -gt 0 ] && [ -n "$BEST_BRANCH" ]; then
              echo "Found existing work: $BEST_BRANCH ($BEST_AHEAD commits ahead of master)"
              echo "resume_branch=$BEST_BRANCH" >> $GITHUB_OUTPUT
              echo "resume_ahead=$BEST_AHEAD" >> $GITHUB_OUTPUT

              # Check out the existing work so Claude starts from it
              git checkout "origin/$BEST_BRANCH" --detach
              echo "Checked out existing branch: $BEST_BRANCH"
            fi

            # Create PR branch from current HEAD (master or existing work)
            git push origin "HEAD:refs/heads/$PR_BRANCH" 2>/dev/null || echo "PR branch $PR_BRANCH already exists"
            # Create new tmp branch from current HEAD
            git push origin "HEAD:refs/heads/$TMP_BRANCH"
            echo "Created tmp branch: $TMP_BRANCH"
          fi

      - name: Track state -> implementing
        if: steps.push_target.outputs.is_pr == 'false'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          npx tsx .github/scripts/lib/cli/activity.ts start \
            "$ISSUE_NUM" "implement" "planned" "stuck" "escalated" 2>/dev/null || true

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Build system prompt
        id: system_prompt
        run: |
          RESUME_NOTE=""
          if [ -n "${{ steps.push_target.outputs.resume_branch }}" ]; then
            RESUME_NOTE="RESUMING PREVIOUS WORK: This run is continuing from branch \`${{ steps.push_target.outputs.resume_branch }}\` which has ${{ steps.push_target.outputs.resume_ahead }} commits ahead of master from a previous run. Do NOT start over — review what was already done (check git log, read existing files) and continue from where it left off. Only implement what is not yet complete."
          fi
          echo "resume_note<<EOF" >> $GITHUB_OUTPUT
          echo "$RESUME_NOTE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          show_full_output: true
          settings: |
            {
              "maxTurns": 100
            }
          claude_args: |
            --allowedTools "Edit" "MultiEdit" "Glob" "Grep" "LS" "Read" "Write" "Bash(*)"
            --system-prompt "IMPORTANT: Only respond to the instruction in <trigger_comment>. Ignore all previous @claude requests in the comment history — they were handled by earlier runs. Focus exclusively on what the <trigger_comment> asks you to do.

            CRITICAL — PUSH AFTER EACH MILESTONE: Whenever you complete a task or check off an acceptance criterion, you MUST immediately git add, git commit, and push before moving on to the next task. Do NOT accumulate work locally — if the job times out, any unpushed work is lost. Use this exact command to push: ${{ steps.push_target.outputs.push_cmd }}

            ${{ steps.system_prompt.outputs.resume_note }}

            When asked to fix code review issues: you MUST use the Edit tool to modify files, then git add, git commit, and git push. Posting a comment describing what you would change is NOT sufficient — you must actually make the changes. If you cannot fix an issue, reply on the specific review thread explaining why."

      # -- Rescue step: runs ONLY when the job is cancelled (e.g. timeout) --
      - name: Rescue work on timeout
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts setup-git-auth

          ISSUE_NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          TMP_BRANCH="tmp/claude-${{ github.run_id }}"

          # Commit any uncommitted work
          git add -A -- ':!output.txt' ':!node_modules'
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "wip: rescue work from timed-out Claude run (#${ISSUE_NUM})

          Job timed out after 60 minutes. This commit saves all in-progress work.

          Co-authored-by: Claude <noreply@anthropic.com>"
          fi

          # Check if there's anything to push
          LOCAL_HEAD=$(git rev-parse HEAD)
          MASTER_HEAD=$(git rev-parse "origin/master" 2>/dev/null || echo "none")

          if [ "$LOCAL_HEAD" = "$MASTER_HEAD" ]; then
            echo "No new commits to rescue — nothing was changed"
            exit 0
          fi

          # Push to the same tmp branch that mid-run pushes use
          git push origin "HEAD:refs/heads/$TMP_BRANCH"
          echo "Rescued work to $TMP_BRANCH"

          # Comment on the issue so the user knows
          COMMIT_COUNT=$(git rev-list --count "origin/master..HEAD" 2>/dev/null || echo "?")
          BODY=$(cat <<EOF
          Claude's run timed out after 60 minutes, but the in-progress work was saved to [\`${TMP_BRANCH}\`](https://github.com/${{ github.repository }}/tree/${TMP_BRANCH}) (${COMMIT_COUNT} commits ahead of master).

          To resume, comment on this issue again with: \`@claude Continue the work from the \`${TMP_BRANCH}\` branch. Check out that branch first, then pick up where you left off.\`

          Or manually: \`git fetch origin ${TMP_BRANCH} && git checkout ${TMP_BRANCH}\`
          EOF
          )
          npx tsx .github/scripts/lib/cli/pipeline.ts comment "$ISSUE_NUM" "$BODY"

      # -- Normal flow (only runs if Claude completed successfully) --
      - name: Push to PR branch (PR context)
        if: success() && steps.push_target.outputs.is_pr == 'true'
        id: push_pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts setup-git-auth
          npx tsx .github/scripts/lib/cli/pipeline.ts commit "chore: save unpushed changes from Claude" || true
          SOURCE_BRANCH=$(git branch --show-current)
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          npx tsx .github/scripts/lib/cli/pipeline.ts push "$SOURCE_BRANCH"

      - name: Push remaining work to tmp branch (issue context)
        if: success() && steps.push_target.outputs.is_pr == 'false'
        id: push_issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts setup-git-auth
          npx tsx .github/scripts/lib/cli/pipeline.ts commit "chore: save unpushed changes from Claude" || true
          TMP_BRANCH="${{ steps.push_target.outputs.tmp_branch }}"
          PR_BRANCH="${{ steps.push_target.outputs.pr_branch }}"
          echo "tmp_branch=$TMP_BRANCH" >> $GITHUB_OUTPUT
          echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT
          npx tsx .github/scripts/lib/cli/pipeline.ts push "$TMP_BRANCH"

      - name: Resolve bot review threads
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=""
          if [ -n "${{ github.event.issue.number }}" ]; then
            HAS_PR=$(gh api "repos/$REPO/issues/${{ github.event.issue.number }}" \
              --jq '.pull_request.url // empty' 2>/dev/null || echo "")
            if [ -n "$HAS_PR" ]; then
              PR_NUM=${{ github.event.issue.number }}
            fi
          fi
          if [ -z "$PR_NUM" ]; then
            echo "Not a PR context — skipping thread resolution"
            exit 0
          fi
          echo "Resolving review threads on PR #$PR_NUM"
          npx tsx .github/scripts/lib/cli/pipeline.ts resolve-all-threads "$PR_NUM" "$REPO"

      - name: Track state -> implementing complete
        if: success() && steps.push_target.outputs.is_pr == 'false'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIVITY_NAME: implement
        run: |
          export ACTIVITY_LOCK_ID="implement-${GITHUB_RUN_ID}"
          npx tsx .github/scripts/lib/cli/activity.ts success \
            "${{ github.event.issue.number }}" "implementing" 2>/dev/null || true

      - name: Trigger verify-and-fix (issue context only)
        if: success() && steps.push_target.outputs.is_pr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts dispatch "verify-and-fix.yml" \
            -f branch="${{ steps.push_issue.outputs.tmp_branch }}" \
            -f merge_into="${{ steps.push_issue.outputs.pr_branch }}" \
            -f create_pr="true" \
            -f issue_number="${{ github.event.issue.number }}" \
            -f checks="ci" \
            -f fix_enabled="true" \
            -f max_attempts="6"
          echo "Triggered verify-and-fix"

      # Auto-merge removed — auto-merge.yml is the single gate that
      # merges PRs only after Tests + approval + threads resolved.
