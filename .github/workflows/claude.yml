name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Scope concurrency by comment author so bot status comments
# (e.g. claude[bot]'s "working…") get their own group and never
# cancel or queue behind the real human-triggered run.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.user.login }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.issue != null || github.event.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to PR branch if applicable
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUM=${{ github.event.pull_request.number }}
          else
            PR_NUM=${{ github.event.issue.number }}
          fi
          PR_BRANCH=$(gh pr view "$PR_NUM" --json headRefName -q '.headRefName')
          echo "Switching to PR branch: $PR_BRANCH"
          git checkout "$PR_BRANCH"

      # TODO: Set up your language runtime and install dependencies here.
      # Examples:
      #
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - name: Install dependencies
      #   run: npm ci
      #
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TODO: Customize allowed tools for your stack
          allowed_tools: "Bash(git:*),Bash(gh:*)"

      - name: Push to temporary branch
        id: push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Remember the working branch (claude-code-action creates its own branch for issues)
          SOURCE_BRANCH=$(git branch --show-current)
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT

          # Commit any uncommitted changes (safety net)
          CHANGES=$(git status --porcelain | grep -v '^?? output.txt$' || true)
          if [ -n "$CHANGES" ]; then
            git add -u
            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "chore: save unpushed changes from Claude

          Co-authored-by: Claude <noreply@anthropic.com>"
            fi
          fi

          # Create temp branch and push
          TMP_BRANCH="tmp/claude-${{ github.run_id }}"
          echo "tmp_branch=$TMP_BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$TMP_BRANCH"
          git push -u origin "$TMP_BRANCH"
          echo "Pushed to $TMP_BRANCH"

      - name: Resolve bot review threads
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=""
          if [ -n "${{ github.event.issue.number }}" ]; then
            HAS_PR=$(gh api "repos/$REPO/issues/${{ github.event.issue.number }}" \
              --jq '.pull_request.url // empty' 2>/dev/null || echo "")
            if [ -n "$HAS_PR" ]; then
              PR_NUM=${{ github.event.issue.number }}
            fi
          fi

          if [ -z "$PR_NUM" ]; then
            echo "Not a PR context — skipping thread resolution"
            exit 0
          fi

          echo "Resolving review threads on PR #$PR_NUM"
          OWNER=$(echo "$REPO" | cut -d/ -f1)
          NAME=$(echo "$REPO" | cut -d/ -f2)

          THREAD_IDS=$(gh api graphql -f query="
            query {
              repository(owner: \"$OWNER\", name: \"$NAME\") {
                pullRequest(number: $PR_NUM) {
                  reviewThreads(first: 100) {
                    nodes { id isResolved }
                  }
                }
              }
            }
          " --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | .id' 2>/dev/null || echo "")

          if [ -z "$THREAD_IDS" ]; then
            echo "No unresolved review threads"
            exit 0
          fi

          echo "$THREAD_IDS" | while read -r TID; do
            if [ -n "$TID" ]; then
              gh api graphql -f query="
                mutation {
                  resolveReviewThread(input: {threadId: \"$TID\"}) {
                    thread { isResolved }
                  }
                }
              " 2>/dev/null && echo "Resolved thread $TID" || echo "Failed to resolve $TID"
            fi
          done

      - name: Extract issue number
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM=""
          SOURCE="${{ steps.push.outputs.source_branch }}"

          # Try branch name first (claude/issue-123)
          ISSUE_NUM=$(echo "$SOURCE" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || true)

          # Fall back to comment context (if commenting on an issue, not a PR)
          if [ -z "$ISSUE_NUM" ] && [ -n "${{ github.event.issue.number }}" ]; then
            IS_PR=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
              --jq '.pull_request.url // empty' 2>/dev/null || echo "")
            if [ -z "$IS_PR" ]; then
              ISSUE_NUM=${{ github.event.issue.number }}
            fi
          fi

          echo "number=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Trigger verify-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TMP_BRANCH="${{ steps.push.outputs.tmp_branch }}"
          SOURCE_BRANCH="${{ steps.push.outputs.source_branch }}"
          ISSUE_NUM="${{ steps.issue.outputs.number }}"

          gh workflow run verify-merge.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f tmp_branch="$TMP_BRANCH" \
            -f target_branch="$SOURCE_BRANCH" \
            -f issue_number="${ISSUE_NUM:-}" \
            -f attempt="1"

          echo "Triggered verify-merge for $TMP_BRANCH -> $SOURCE_BRANCH"
