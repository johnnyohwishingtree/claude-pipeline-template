name: Fix Review Feedback
run-name: "Review fix: PR #${{ inputs.pr_number }} (round ${{ inputs.round }})"

# Runs Claude with full permissions to fix code review feedback on a PR.
# Triggered by review-relay via workflow_dispatch instead of @claude PR comment,
# because claude-code-action@v1 restricts tools (no Edit/Write) in PR comment context.
#
# After Claude addresses review feedback, pushes and dispatches verify-and-fix.yml
# for quality checks with retry capability (up to 3 fix attempts).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix'
        required: true
        type: string
      pr_branch:
        description: 'PR head branch name'
        required: true
        type: string
      review_summary:
        description: 'Review feedback to address'
        required: true
        type: string
      reviewer:
        description: 'Reviewer username'
        required: false
        type: string
        default: 'bot'
      round:
        description: 'Review round (1-3)'
        required: false
        type: string
        default: '1'

concurrency:
  group: review-fix-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_branch }}
          fetch-depth: 0

      - name: Configure git and auth
        uses: ./.github/actions/setup-auth
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup pipeline TypeScript
        uses: ./.github/actions/setup-pipeline-ts

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Run Claude to fix review feedback
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          prompt: |
            Fix code review feedback on PR #${{ inputs.pr_number }} (review round ${{ inputs.round }}/3, reviewer: ${{ inputs.reviewer }}).

            HERE IS THE REVIEW FEEDBACK TO ADDRESS:
            ${{ inputs.review_summary }}

            INSTRUCTIONS:
            1. Read each review comment carefully
            2. If the feedback is valid, fix the code using the Edit tool
            3. If the feedback is incorrect or not applicable, reply on the PR explaining why
            4. After fixing, run `pnpm typecheck` and `pnpm test` to verify no regressions
            5. If the review feedback points to a recurring pattern, prevent it from happening again:
               a. **Syntax/style pattern** (e.g., "avoid `as any`", "use optional chaining") -> add an ESLint rule in `.eslintrc.js` as a warning
               b. **Architecture/convention** (e.g., "components shouldn't import stores", "extract hooks from fat screens") -> add or update a rule in `.claude/rules/`
               c. **Structural check** (e.g., "files too long", "missing checkout step") -> add a vitest test in `.github/scripts/__tests__/`
               Only do this if the pattern is general enough to apply beyond this one PR.
            6. Git add and commit your changes — do NOT push (the workflow will push after verification)
          show_full_output: true
          claude_args: --allowedTools "Edit" "MultiEdit" "Glob" "Grep" "LS" "Read" "Write" "Bash(*)"
          settings: |
            {
              "maxTurns": 20
            }

      # Resolve threads BEFORE pushing so that when the push triggers
      # auto-merge.yml (via pull_request: synchronize), threads are
      # already resolved and the merge gate passes on first eval.
      - name: Resolve review threads
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Resolving review threads on PR #${{ inputs.pr_number }}"
          npx tsx .github/scripts/lib/cli/pipeline.ts resolve-all-threads "${{ inputs.pr_number }}" "${{ github.repository }}"

      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx tsx .github/scripts/lib/cli/pipeline.ts setup-git-auth

          npx tsx .github/scripts/lib/cli/pipeline.ts commit "fix: address review feedback (round ${{ inputs.round }})" || true
          npx tsx .github/scripts/lib/cli/pipeline.ts push "${{ inputs.pr_branch }}"

      - name: Comment and dispatch verification
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          npx tsx .github/scripts/lib/cli/pipeline.ts comment "${{ inputs.pr_number }}" "Review fix round ${{ inputs.round }}/3 complete. Review threads resolved. Dispatching verification with retry. [View run]($RUN_URL)"

          npx tsx .github/scripts/lib/cli/pipeline.ts dispatch "verify-and-fix.yml" \
            -f branch="${{ inputs.pr_branch }}" \
            -f issue_number="${{ inputs.pr_number }}" \
            -f checks="all" \
            -f fix_enabled="true" \
            -f max_attempts="3" \
            -f fix_context="This branch is PR #${{ inputs.pr_number }}. Review feedback was addressed in round ${{ inputs.round }}/3. Fix any remaining check failures without reverting the review fixes."
