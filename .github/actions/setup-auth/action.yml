name: 'Setup Git Auth'
description: 'Configure git remote URL with token and set user identity'

inputs:
  token:
    description: 'GitHub token for authentication'
    required: true
  user_name:
    description: 'Git user name'
    required: false
    default: 'Claude CI'
  user_email:
    description: 'Git user email'
    required: false
    default: 'claude-ci@users.noreply.github.com'

runs:
  using: 'composite'
  steps:
    - name: Configure git auth
      shell: bash
      run: |
        git remote set-url origin "https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}.git"
        git config user.name "${{ inputs.user_name }}"
        git config user.email "${{ inputs.user_email }}"
