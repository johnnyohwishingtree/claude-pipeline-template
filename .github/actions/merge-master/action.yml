name: 'Merge Master'
description: 'Fetch and merge master into current branch, handling conflicts'

inputs:
  strategy:
    description: 'Conflict resolution strategy: abort (default), infra-theirs, ours'
    required: false
    default: 'abort'

outputs:
  conflict:
    description: 'Whether a merge conflict occurred (true/false)'
    value: ${{ steps.merge.outputs.conflict }}

runs:
  using: 'composite'
  steps:
    - name: Merge master
      id: merge
      shell: bash
      run: |
        git fetch origin master
        if git merge origin/master --no-edit; then
          echo "conflict=false" >> $GITHUB_OUTPUT
        else
          STRATEGY="${{ inputs.strategy }}"

          if [ "$STRATEGY" = "abort" ]; then
            echo "::warning::Merge conflict with master"
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT

          elif [ "$STRATEGY" = "infra-theirs" ]; then
            # Infrastructure files take master, everything else takes ours
            CONFLICTING=$(git diff --name-only --diff-filter=U || true)
            for file in $CONFLICTING; do
              if echo "$file" | grep -qE '^\.(github|claude)/|^docs/pipeline|^CLAUDE\.md|lock\.(yaml|json)$|Podfile\.lock$'; then
                git checkout origin/master -- "$file"
              else
                git checkout --ours "$file"
              fi
              git add "$file"
            done
            git commit --no-edit
            echo "conflict=false" >> $GITHUB_OUTPUT

          elif [ "$STRATEGY" = "ours" ]; then
            CONFLICTING=$(git diff --name-only --diff-filter=U || true)
            for file in $CONFLICTING; do
              git checkout --ours "$file"
              git add "$file"
            done
            git commit --no-edit
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi
        fi
